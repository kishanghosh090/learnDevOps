version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama-server
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - ai-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  app:
    build: .
    container_name: ai-ollama-app
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - 3000
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-network

  nginx:
    image: nginx:alpine
    container_name: ai-ollama-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - ai-network

volumes:
  ollama_data:

networks:
  ai-network:
    driver: bridge
