<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat - Ollama</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 800px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2em;
      }

      .input-section {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        color: #555;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        font-family: inherit;
        resize: vertical;
        transition: border-color 0.3s;
      }

      textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .response-section {
        margin-top: 30px;
        display: none;
      }

      .response-section.show {
        display: block;
      }

      .response-box {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 10px;
        min-height: 100px;
        white-space: pre-wrap;
        word-wrap: break-word;
        color: #333;
        line-height: 1.6;
      }

      .loading {
        text-align: center;
        color: #667eea;
        font-style: italic;
        padding: 20px;
      }

      .error {
        background: #ffe6e6;
        border-left-color: #dc3545;
        color: #dc3545;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🤖 AI Chat with Ollama</h1>

      <div class="input-section">
        <label for="promptInput">Enter your prompt:</label>
        <textarea
          id="promptInput"
          placeholder="Ask me anything..."
          autofocus
        ></textarea>
      </div>

      <button id="generateBtn" onclick="generateText()">
        Generate Response
      </button>

      <div id="responseSection" class="response-section">
        <label>AI Response:</label>
        <div id="responseBox" class="response-box"></div>
      </div>
    </div>

    <script>
      const promptInput = document.getElementById("promptInput");
      const generateBtn = document.getElementById("generateBtn");
      const responseSection = document.getElementById("responseSection");
      const responseBox = document.getElementById("responseBox");

      // Allow Enter key to submit (Shift+Enter for new line)
      promptInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          generateText();
        }
      });

      async function generateText() {
        const prompt = promptInput.value.trim();

        if (!prompt) {
          alert("Please enter a prompt");
          return;
        }

        // Show loading state
        generateBtn.disabled = true;
        generateBtn.textContent = "Generating...";
        responseSection.classList.add("show");
        responseBox.className = "response-box";
        responseBox.innerHTML =
          '<div class="spinner"></div><div class="loading">AI is thinking...</div>';

        try {
          const response = await fetch(
            "http://165.22.209.126:3000/api/ai/generate",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ prompt }),
            },
          );

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          // Display response
          responseBox.className = "response-box";
          responseBox.textContent =
            data.response || data.message || "No response received";
        } catch (error) {
          console.error("Error:", error);
          responseBox.className = "response-box error";
          responseBox.textContent = `Error: ${error.message}. Make sure the server is running and Ollama is available.`;
        } finally {
          generateBtn.disabled = false;
          generateBtn.textContent = "Generate Response";
        }
      }
    </script>
  </body>
</html>
